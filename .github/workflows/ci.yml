# Continuous integration: every PR (including Copilot's) must pass this before a
# human approves and merges. This gives the human-in-the-loop review something
# objective to lean on.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test
