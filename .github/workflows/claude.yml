# Interactive Claude: mention @claude in an issue or pull request to ask it to
# explain, change, or fix something. On a PR, Claude pushes follow-up commits to
# the same branch — this is how you iterate during review without leaving GitHub.
#
# This complements claude-implement.yml (which kicks off a fresh PR from an
# issue). Here, @claude responds in-thread to whatever you ask.
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Only run when a human actually mentions @claude (avoids reacting to every comment).
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write # let the action mint its GitHub token (OIDC)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          trigger_phrase: "@claude"
          base_branch: main
          claude_args: |
            --model claude-opus-4-8
            --max-turns 25
